<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم foodies.a</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #101216;
      --bg-surface: #181b22;
      --bg-card: #1f232c;
      --gold-primary: #e5a93c;
      --gold-gradient: linear-gradient(135deg, #f6c065 0%, #d49326 100%);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-white); padding: 16px; padding-bottom: 60px; }

    #authOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .auth-box h3 { margin-bottom: 12px; color: var(--gold-primary); }
    .auth-box input { margin-bottom: 14px; text-align: center; letter-spacing: 4px; font-size: 1.2rem; }

    header {
      text-align: center;
      padding: 14px 0 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.3rem; color: var(--gold-primary); font-weight: 900; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: var(--gold-gradient);
      border-radius: 4px;
      display: inline-block;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }

    input, select, textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold-primary); }

    .btn {
      width: 100%;
      background: var(--gold-gradient);
      color: #101216;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      margin-top: 8px;
    }
    .btn-cancel {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      margin-top: 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .cat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .cat-header {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    .cat-title { font-weight: 800; font-size: 0.92rem; color: var(--gold-primary); }
    .btn-del-cat {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.84rem;
    }
    .item-row:last-child { border-bottom: none; }
    .item-info { display: flex; align-items: center; gap: 10px; }
    .item-thumb {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      background: #111;
    }
    .item-price-tag {
      display: inline-block;
      background: rgba(229, 169, 60, 0.15);
      color: var(--gold-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 3px;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-edit-item {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn-del-item {
      background: none;
      border: none;
      color: #f87171;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-weight: 800;
      color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <!-- شاشة التحقق من كلمة السر -->
  <div id="authOverlay">
    <div class="auth-box">
      <h3>أدخل رمز الدخول (PIN)</h3>
      <input type="password" id="pinInput" placeholder="•••••" maxlength="5">
      <button class="btn" onclick="checkPin()">دخول</button>
    </div>
  </div>

  <div id="loadingOverlay">جاري معالجة البيانات...</div>

  <header>
    <h1>لوحة إدارة المنيو | foodies.a</h1>
    <p>إدارة الأقسام والوجبات وتحديث المنيو لحظياً</p>
  </header>

  <section class="card">
    <h2>إضافة قسم جديد</h2>
    <div class="form-group">
      <input type="text" id="newCatName" placeholder="اسم القسم الجديد (مثلاً: حلويات، مشروبات)">
    </div>
    <button class="btn" onclick="addCategory()">+ إضافة القسم</button>
  </section>

  <section class="card" id="itemFormCard">
    <h2 id="itemFormTitle">إضافة وجبة ضمن قسم</h2>
    
    <div class="form-group">
      <label>القسم</label>
      <select id="itemCatSelect"></select>
    </div>

    <div class="form-group">
      <label>اسم الوجبة</label>
      <input type="text" id="itemName" placeholder="اسم الوجبة">
    </div>

    <div class="form-group">
      <label>السعر (اختياري)</label>
      <input type="text" id="itemPrice" placeholder="مثلاً: 25,000 ل.س أو 25000">
    </div>

    <div class="form-group">
      <label>وصف الوجبة (اختياري)</label>
      <textarea id="itemDesc" rows="2" placeholder="المكونات والتفاصيل"></textarea>
    </div>

    <div class="form-group">
      <label>رابط الصورة (اختياري)</label>
      <input type="url" id="itemImg" placeholder="https://...">
    </div>

    <button class="btn" id="saveItemBtn" onclick="saveItemAction()">+ حفظ الوجبة في المنيو</button>
    <button class="btn btn-cancel" id="cancelEditBtn" onclick="cancelEditing()" style="display: none;">إلغاء التعديل</button>
  </section>

  <section class="card">
    <h2>الأقسام والوجبات الحالية</h2>
    <button class="btn btn-secondary" onclick="seedInitialMenu()" style="margin-bottom: 14px;">
      🔄 رفع الأصناف الحالية تلقائياً إلى قاعدة البيانات (مرة واحدة)
    </button>
    <div id="menuStructureView"></div>
  </section>

      catIdx: null,

      if (pin === CORRECT_PIN) {
        document.getElementById("authOverlay").style.display = "none";
        loadMenu();
      } else {
        alert("رمز الدخول غير صحيح!");
      }
    }

    async function loadMenu() {
      showLoading(true);
      try {
        const res = await fetch(DB_URL);
        const data = await res.json();
        currentMenu = Array.isArray(data) ? data : (data ? Object.values(data) : []);
        renderSelect();
        renderView();
      } catch (err) {
        alert("خطأ في الاتصال بقاعدة البيانات");
      }
      showLoading(false);
    }

    async function saveMenu() {
      showLoading(true);
      try {
        await fetch(DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(currentMenu)
        });
        renderSelect();
        renderView();
      } catch (err) {
        alert("فشل حفظ التعديلات");
      }
      showLoading(false);
    }

    async function seedInitialMenu() {
      if (!confirm("هل تريد رفع الأصناف الحالية تلقائياً إلى قاعدة البيانات؟ سيتم استبدال البيانات الحالية.")) return;
      currentMenu = defaultInitialData;
      await saveMenu();
      alert("تم رفع بيانات المنيو بنجاح!");
    }

    function renderSelect() {
      const select = document.getElementById("itemCatSelect");
      if (currentMenu.length === 0) {
        select.innerHTML = `<option value="">لا توجد أقسام حالياً</option>`;
        return;
      }
      select.innerHTML = currentMenu.map(c => `<option value="${c.id}">${c.categoryName}</option>`).join('');
    }

    function renderView() {
      const box = document.getElementById("menuStructureView");
      if (currentMenu.length === 0) {
        box.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:10px;">لا توجد أقسام مضافة بعد.</p>`;
        return;
      }

      box.innerHTML = currentMenu.map((cat, catIdx) => `
        <div class="cat-box">
          <div class="cat-header">
            <span class="cat-title">${cat.categoryName} (${cat.items ? cat.items.length : 0})</span>
            <button class="btn-del-cat" onclick="deleteCategory(${catIdx})">حذف القسم 🗑️</button>
          </div>
          <div>
            ${(cat.items || []).map((it, itIdx) => `
              <div class="item-row">
                <div class="item-info">
                  <img src="${it.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=100&q=80'}" class="item-thumb">
                  <div>
                    <div style="font-weight:700;">${it.name || 'بدون اسم'}</div>
                    ${it.price ? `<span class="item-price-tag">${it.price}</span>` : ''}
                    <div style="font-size:0.75rem; color:var(--text-muted);">${it.desc || ''}</div>
                  </div>
                </div>
                <div class="item-actions">
                  <button class="btn-edit-item" onclick="startEditItem(${catIdx}, ${itIdx})" title="تعديل">✏️</button>
                  <button class="btn-del-item" onclick="deleteItem(${catIdx}, ${itIdx})" title="حذف">✕</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function addCategory() {
      const input = document.getElementById("newCatName");
      const name = input.value.trim();
      const id = "sec-" + (name ? name.replace(/\s+/g, '-').toLowerCase() : Date.now());
      currentMenu.push({ id, categoryName: name || "قسم جديد", items: [] });
      input.value = "";
      await saveMenu();
    }

    async function deleteCategory(catIdx) {
      if (!confirm(`هل أنت متأكد من حذف قسم "${currentMenu[catIdx].categoryName}" بكل وجباته؟`)) return;
      currentMenu.splice(catIdx, 1);
      if (editingState.isEditing && editingState.catIdx === catIdx) cancelEditing();
      await saveMenu();
    }

    function startEditItem(catIdx, itIdx) {
      const cat = currentMenu[catIdx];
      const item = cat.items[itIdx];

      editingState = { isEditing: true, catIdx, itIdx };

      document.getElementById("itemCatSelect").value = cat.id;
            document.getElementById("itemName").value = item.name || "";
      document.getElementById("itemPrice").value = item.price || "";
      document.getElementById("itemDesc").value = item.desc || "";
      document.getElementById("itemImg").value = item.img || "";

      document.getElementById("itemFormTitle").innerText = "تعديل الوجبة";
      document.getElementById("saveItemBtn").innerText = "💾 حفظ التعديلات";
      document.getElementById("cancelEditBtn").style.display = "block";

      document.getElementById("itemFormCard").scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditing() {
      editingState = { isEditing: false, catIdx: null, itIdx: null };
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemDesc").value = "";
      document.getElementById("itemImg").value = "";

      document.getElementById("itemFormTitle").innerText = "إضافة وجبة ضمن قسم";
      document.getElementById("saveItemBtn").innerText = "+ حفظ الوجبة في المنيو";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    async function saveItemAction() {
      const catId = document.getElementById("itemCatSelect").value;
      const name = document.getElementById("itemName").value.trim();
      const price = document.getElementById("itemPrice").value.trim();
      const desc = document.getElementById("itemDesc").value.trim();
      let img = document.getElementById("itemImg").value.trim();

      if (!img) {
        img = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80";
      }

      if (editingState.isEditing) {
        const oldCat = currentMenu[editingState.catIdx];
        const updatedItem = { name, price, desc, img };

        if (oldCat.id === catId) {
          oldCat.items[editingState.itIdx] = updatedItem;
        } else {
          oldCat.items.splice(editingState.itIdx, 1);
          let targetCat = currentMenu.find(c => c.id === catId);
          if (!targetCat) {
            targetCat = currentMenu[0];
          }
          if (!targetCat.items) targetCat.items = [];
          targetCat.items.push(updatedItem);
        }
        cancelEditing();
      } else {
        let cat = currentMenu.find(c => c.id === catId);
        if (!cat) {
          if (currentMenu.length === 0) {
            currentMenu.push({ id: "sec-عام", categoryName: "عام", items: [] });
          }
          cat = currentMenu[0];
        }
        if (!cat.items) cat.items = [];
        cat.items.push({ name, price, desc, img });

        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("itemImg").value = "";
      }

      await saveMenu();
      alert("تم الحفظ بنجاح!");
    }

    async function deleteItem(catIdx, itIdx) {
      if (!confirm("هل تريد حذف هذه الوجبة؟")) return;
      currentMenu[catIdx].items.splice(itIdx, 1);
      if (editingState.isEditing && editingState.catIdx === catIdx && editingState.itIdx === itIdx) {
        cancelEditing();
      }
      await saveMenu();
    }

    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
    }
  </script>
</body>
</html>
