<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #101216;
      --bg-surface: #181b22;
      --bg-card: #1f232c;
      --gold-primary: #e5a93c;
      --gold-gradient: linear-gradient(135deg, #f6c065 0%, #d49326 100%);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-white); padding: 16px; padding-bottom: 60px; }

    #authOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .auth-box h3 { margin-bottom: 12px; color: var(--gold-primary); }
    .auth-box input { margin-bottom: 14px; text-align: center; letter-spacing: 4px; font-size: 1.2rem; }

    header {
      text-align: center;
      padding: 14px 0 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.3rem; color: var(--gold-primary); font-weight: 900; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: var(--gold-gradient);
      border-radius: 4px;
      display: inline-block;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }

    input, select, textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold-primary); }

    .upload-btn-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }
    .custom-file-upload {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(229, 169, 60, 0.1);
      border: 1px dashed var(--gold-primary);
      color: var(--gold-primary);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .custom-file-upload:active { transform: scale(0.98); }
    #imageFileInput { display: none; }

    .preview-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    .preview-img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
      background: #111;
    }
    .preview-info { flex: 1; font-size: 0.75rem; color: var(--text-muted); }
    .btn-remove-preview {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      background: var(--gold-gradient);
      color: #101216;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;

    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      margin-top: 8px;
    }
    .btn-cancel {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      margin-top: 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);

    .cat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin-bottom: 12px;

    .cat-header {
      padding: 10px 14px;

      justify-content: space-between;

    .btn-del-cat {

      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;

    .item-row {
      display: flex;

      padding: 8px 14px;

    .item-actions {

      font-size: 1rem;

      padding: 4px;

      color: #f87171;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;

      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 300;
      font-weight: 800;
      color: var(--gold-primary);
    }
  </style>
</head>

    function compressImage(file, maxWidth = 480, maxHeight = 480, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(compressedDataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    window.handleFileSelect = async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading(true);

          { name: "سمك أجاج", desc: "سمك بحري مشوي على الفحم أو بالفرن", img: "https://images.unsplash.com/photo-1534080564583-6be75777b70a?auto=format&fit=crop&w=400&q=80" },
          { name: "قريدس (جمبري)", desc: "جمبري مشوي مع الزبدة والثوم والأعشاب العطرية", img: "https://images.unsplash.com/photo-1565680018434-b513d5e5fd47?auto=format&fit=crop&w=400&q=80" },
          { name: "جوانح مشوية", desc: "أجنحة دجاج مشوية بصوص الباربكيو المدخن", img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?auto=format&fit=crop&w=400&q=80" }
        ]
      },
      {
        id: "sec-أطباق-صحية-ومقبلات",
        categoryName: "أطباق صحية ومقبلات",
        items: [
          { name: "وجبات صحية (أرز + شوربة)", desc: "وجبة خفيفة ومتوازنة للمهتمين بالرشاقة", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80" },
          { name: "سلطة فتوش", desc: "خضار طازجة مع خبز محمص ورمان وسماق", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=400&q=80" },
          { name: "كبة مقلية", desc: "أقراص مقرمشة محشوة باللحم البلدي والمكسرات", img: "https://images.unsplash.com/photo-1541529086526-db283c563270?auto=format&fit=crop&w=400&q=80" },
                    { name: "مقرمشات فوديز", desc: "سناك ونقانق ومقرمشات محضرة يومياً", img: "https://images.unsplash.com/photo-1599490659213-e2b9527bd087?auto=format&fit=crop&w=400&q=80" }
        ]
      },
      {
        id: "sec-فطائر-وصاج",
        categoryName: "فطائر وصاج",
        items: [
          { name: "منافيش عالصاج", desc: "فطائر ومناقيش صاج ساخنة (زعتر، جبنة، محمرة)", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=400&q=80" }
        ]
      }
    ];

    async function loadMenu() {
      showLoading(true);
      try {
        const snapshot = await get(ref(db, "menu"));
        const data = snapshot.val();
        currentMenu = Array.isArray(data) ? data : (data ? Object.values(data) : []);
        renderSelect();
        renderView();
      } catch (err) {
        alert("خطأ في الاتصال بقاعدة البيانات: " + err.message);
      }
      showLoading(false);
    }

    async function saveMenu() {
      showLoading(true);
      try {
        await set(ref(db, "menu"), currentMenu);
        renderSelect();
        renderView();
      } catch (err) {
        alert("فشل حفظ التعديلات: " + err.message);
      }
      showLoading(false);
    }

    window.seedInitialMenu = async function() {
      if (!confirm("هل تريد رفع الأصناف الحالية تلقائياً إلى قاعدة البيانات؟ سيتم استبدال البيانات الحالية.")) return;
      currentMenu = defaultInitialData;
      await saveMenu();
      alert("تم رفع بيانات المنيو بنجاح!");
    };

    function renderSelect() {
      const select = document.getElementById("itemCatSelect");
      if (currentMenu.length === 0) {
        select.innerHTML = `<option value="">لا توجد أقسام حالياً</option>`;
        return;
      }
      select.innerHTML = currentMenu.map(c => `<option value="${c.id}">${c.categoryName}</option>`).join('');
    }

    function renderView() {
      const box = document.getElementById("menuStructureView");
      if (currentMenu.length === 0) {
        box.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:10px;">لا توجد أقسام مضافة بعد.</p>`;
        return;
      }

      box.innerHTML = currentMenu.map((cat, catIdx) => `
        <div class="cat-box">
          <div class="cat-header">
            <span class="cat-title">${cat.categoryName} (${cat.items ? cat.items.length : 0})</span>
            <button class="btn-del-cat" onclick="deleteCategory(${catIdx})">حذف القسم 🗑️</button>
          </div>
          <div>
            ${(cat.items || []).map((it, itIdx) => `
              <div class="item-row">
                <div class="item-info">
                  <img src="${it.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=100&q=80'}" class="item-thumb">
                  <div>
                    <div style="font-weight:700;">${it.name || 'بدون اسم'}</div>
                    <div style="font-size:0.75rem; color:var(--text-muted);">${it.desc || ''}</div>
                  </div>
                </div>
                <div class="item-actions">
                  <button class="btn-edit-item" onclick="startEditItem(${catIdx}, ${itIdx})" title="تعديل">✏️</button>
                  <button class="btn-del-item" onclick="deleteItem(${catIdx}, ${itIdx})" title="حذف">✕</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.addCategory = async function() {
      const input = document.getElementById("newCatName");
      const name = input.value.trim();
      const id = "sec-" + (name ? name.replace(/\s+/g, '-').toLowerCase() : Date.now());
      currentMenu.push({ id, categoryName: name || "قسم جديد", items: [] });
      input.value = "";
      await saveMenu();
    };

    window.deleteCategory = async function(catIdx) {
      if (!confirm(`هل أنت متأكد من حذف قسم "${currentMenu[catIdx].categoryName}" بكل وجباته؟`)) return;
      currentMenu.splice(catIdx, 1);
      if (editingState.isEditing && editingState.catIdx === catIdx) window.cancelEditing();
      await saveMenu();
    };

    window.startEditItem = function(catIdx, itIdx) {
      const cat = currentMenu[catIdx];
      const item = cat.items[itIdx];

      editingState = { isEditing: true, catIdx, itIdx };

      document.getElementById("itemCatSelect").value = cat.id;
      document.getElementById("itemName").value = item.name || "";
      document.getElementById("itemDesc").value = item.desc || "";

      if (item.img) {
        compressedImageBase64 = item.img;
        document.getElementById("previewImgEl").src = item.img;
        document.getElementById("previewBox").style.display = "flex";
        document.getElementById("previewStatus").innerText = "الصورة الحالية للوجبة";
        document.getElementById("itemImg").value = item.img.startsWith("data:") ? "" : item.img;
      } else {
        window.clearSelectedImage();
      }

      document.getElementById("itemFormTitle").innerText = "تعديل الوجبة";
      document.getElementById("saveItemBtn").innerText = "💾 حفظ التعديلات";
      document.getElementById("cancelEditBtn").style.display = "block";

      document.getElementById("itemFormCard").scrollIntoView({ behavior: 'smooth' });
    };

    window.cancelEditing = function() {
      editingState = { isEditing: false, catIdx: null, itIdx: null };
      document.getElementById("itemName").value = "";
      document.getElementById("itemDesc").value = "";
      document.getElementById("itemImg").value = "";
      window.clearSelectedImage();

      document.getElementById("itemFormTitle").innerText = "إضافة وجبة ضمن قسم";
      document.getElementById("saveItemBtn").innerText = "+ حفظ الوجبة في المنيو";
      document.getElementById("cancelEditBtn").style.display = "none";
    };

    window.saveItemAction = async function() {
      const catId = document.getElementById("itemCatSelect").value;
      const name = document.getElementById("itemName").value.trim();
      const desc = document.getElementById("itemDesc").value.trim();
      const directUrl = document.getElementById("itemImg").value.trim();

      let img = compressedImageBase64 || directUrl;
      if (!img) {
        img = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80";
      }

      if (editingState.isEditing) {
        const oldCat = currentMenu[editingState.catIdx];
        const updatedItem = { name, desc, img };

        if (oldCat.id === catId) {
          oldCat.items[editingState.itIdx] = updatedItem;
        } else {
          oldCat.items.splice(editingState.itIdx, 1);
          let targetCat = currentMenu.find(c => c.id === catId);
          if (!targetCat) {
            targetCat = currentMenu[0];
          }
          if (!targetCat.items) targetCat.items = [];
          targetCat.items.push(updatedItem);
        }
        window.cancelEditing();
      } else {
        let cat = currentMenu.find(c => c.id === catId);
        if (!cat) {
          if (currentMenu.length === 0) {
            currentMenu.push({ id: "sec-عام", categoryName: "عام", items: [] });
          }
          cat = currentMenu[0];
        }
        if (!cat.items) cat.items = [];
        cat.items.push({ name, desc, img });

        document.getElementById("itemName").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("itemImg").value = "";
        window.clearSelectedImage();
      }

      await saveMenu();
      alert("تم الحفظ بنجاح!");
    };

    window.deleteItem = async function(catIdx, itIdx) {
      if (!confirm("هل تريد حذف هذه الوجبة؟")) return;
      currentMenu[catIdx].items.splice(itIdx, 1);
      if (editingState.isEditing && editingState.catIdx === catIdx && editingState.itIdx === itIdx) {
        window.cancelEditing();
      }
      await saveMenu();
    };

    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
    }
  </script>
</body>
</html>
